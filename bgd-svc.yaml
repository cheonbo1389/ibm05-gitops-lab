apiVersion: v1
kind: Service # '네트워크 연결(서비스)'
metadata: # 1. 기본 정보 설정
  name: bgd # 서비스 고정이름(도메인 주소)
  namespace: bgd # 서비스 고정이름(도메인 주소)
  labels:
    app: bgd
spec:
  selector: # 2. 목적지 지정
    app: bgd
  ports:
  - protocol: TCP # 2. 목적지 지정
    port: 8080
    targetPort: 8080 # Pod 내부에서 열려있는 포트번호이며, 서비스가 받은 요청을
